<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#111827'><title>12-Week Athletic Performance Tracker</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f5f7fb;color:#172033;margin:0}header{background:#111827;color:white;padding:18px;position:sticky;top:0;z-index:5}h1{font-size:21px;margin:0}.sub{opacity:.75;font-size:13px}nav{display:flex;gap:7px;overflow:auto;background:white;padding:10px;position:sticky;top:64px;z-index:4}button,select,input,textarea{font:inherit}nav button,.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:650}nav button{background:#eef2f7}nav button.active,.primary{background:#2563eb;color:#fff}main{max-width:900px;margin:auto;padding:12px 10px 60px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.stat{background:#f8fafc;border-radius:10px;padding:12px}.stat b{display:block;font-size:21px}.muted{color:#667085;font-size:13px}.row{display:flex;gap:8px}.row>*{flex:1}select,input,textarea{width:100%;box-sizing:border-box;border:1px solid #d0d5dd;border-radius:8px;padding:8px;background:#fff}.exercise{border-top:1px solid #e4e7ec;padding:13px 0;min-height:80px}.exercise:first-child{border-top:0}.diagram{float:right;width:110px;height:82px;border:1px solid #e4e7ec;border-radius:9px;margin-left:9px;background:#fafafa}.diagram svg{width:100%;height:100%}.name{font-weight:750}.target{font-size:13px;color:#667085;margin-top:3px}.setgrid{display:grid;grid-template-columns:28px 1fr 1fr 30px;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:#667085}.setgrid input[type=checkbox]{width:19px;height:19px;accent-color:#16a34a}.bar{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb}.clear{clear:both}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #e4e7ec;text-align:left}@media(max-width:600px){.diagram{width:92px;height:70px}}</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Athletic Tracker"><link rel="apple-touch-icon" href="icon-180.png"><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))}</script></head><body><header><h1>12-Week Athletic Performance</h1><div class='sub'>5 days/week • speed • muscle • vertical • conditioning • power</div></header><nav id='nav'></nav><main id='app'></main><script>
const info={
'KB Swing':'Hip hinge; snap the hips and keep the bell close.','Goblet Squat':'Brace, squat between the hips, drive through the floor.','Single-arm KB Clean':'Keep the bell close and finish tall; avoid curling it.','Reverse Lunge':'Step back softly and drive through the front foot.','Single-arm KB Row':'Brace the torso and pull the elbow toward the hip.','Push-up':'Straight body line; controlled down, strong press.','Clean & Press':'Clean to rack, brace, then press overhead.','KB Push Press':'Small dip and powerful leg drive into the press.','Back Squat':'Brace hard; controlled descent and strong drive.','RDL':'Soft knees, hips back, lats tight, feel hamstrings.','Bulgarian Split Squat':'Stable front foot; control the knee and hip.','Hamstring Curl':'Control both directions and squeeze at contraction.','Calf Raise':'Full stretch and strong peak contraction.','Pallof Press':'Resist rotation; ribs down and glutes tight.','Countermovement Jump':'Quick dip, maximal jump, quiet balanced landing.','Broad Jump':'Arm swing and explosive hip drive; stick the landing.','Lateral Bound':'Push sideways and stabilize each single-leg landing.','Box Jump':'Jump maximally, land softly, step down.','Approach Jump':'Use consistent volleyball approach mechanics; jump high.','Skater Jump':'Explode laterally and control each landing.','Depth Landing':'Step off, absorb quietly with good alignment.','5-10-5 Shuttle':'Stay low; plant outside foot and accelerate.','Lateral Shuffle':'Stay low and avoid crossing the feet.','Wall Acceleration Drill':'Lean into wall; alternate powerful knee drives.','Sled Push':'Forward body angle, powerful steps, hard floor drive.','Bench Press':'Set shoulders; controlled touch and even press.','Pull-up':'Controlled hang; pull chest toward bar without swinging.','DB Incline Press':'Stable shoulders; smooth press and controlled lowering.','Chest-supported Row':'Pull elbows back and pause briefly.','DB Lateral Raise':'Soft elbows; raise with control.','Cable Triceps':'Stable elbows; full controlled extension.','DB Curl':'Elbows near sides; controlled lowering.','Med-ball Rotational Throw':'Rotate through hips and trunk; throw explosively.','Med-ball Scoop Toss':'Load hips and extend rapidly into the throw.','Trap-bar Deadlift':'Brace, push floor away, finish tall.','Front Squat':'Elbows high; brace and descend under control.','Push Press':'Vertical dip and drive; powerful lockout.','Weighted Pull-up':'Strict reps; no swinging.','Bike Zone 2':'Steady conversational pace, RPE 5–6.','Bike Intervals':'Hard efforts RPE 8–9 with full easy recovery.'};
const days={1:{title:'KB + steady state',ex:[['KB Swing',4,'15',7],['Goblet Squat',4,'10',7],['Single-arm KB Clean',4,'6/side',7],['Reverse Lunge',4,'8/side',7],['Single-arm KB Row',4,'10/side',7],['Push-up',4,'12',7],['Bike Zone 2',1,'30 min',6]]},2:{title:'Speed substitute + lower + vertical',ex:[['Sled Push',6,'10–15 sec',8],['Countermovement Jump',4,'3',7],['Broad Jump',3,'2',7],['Back Squat',4,'5',7],['RDL',3,'8',7],['Bulgarian Split Squat',3,'8/leg',7],['Hamstring Curl',2,'10',7],['Calf Raise',2,'12',7]]},3:{title:'KB + conditioning',ex:[['KB Swing',5,'20',8],['Goblet Squat',5,'10',7],['Clean & Press',5,'6/side',8],['Reverse Lunge',5,'8/side',7],['Single-arm KB Row',5,'10/side',7],['Bike Intervals',8,'45 sec hard / 75 sec easy',8],['Bike Zone 2',1,'20 min',6]]},4:{title:'Agility + upper + plyos',ex:[['Sled Push',4,'10–15 sec',8],['Lateral Shuffle',4,'10–15 sec',8],['5-10-5 Shuttle',3,'1',8],['Approach Jump',4,'2',8],['Box Jump',3,'3',7],['Bench Press',4,'6',7],['Pull-up',4,'5–8',7],['DB Incline Press',3,'8',7],['Chest-supported Row',3,'8',7],['DB Lateral Raise',2,'12–15',7]]},5:{title:'Power + full body + cardio',ex:[['Box Jump',3,'3',8],['Med-ball Rotational Throw',4,'4/side',8],['Med-ball Scoop Toss',3,'4',8],['Trap-bar Deadlift',4,'5',7],['Front Squat',3,'6',7],['Push Press',4,'5',7],['Weighted Pull-up',3,'5',7],['Bike Zone 2',1,'15–20 min',6] ]}};
let S=JSON.parse(localStorage.getItem('athleticV1')||'null')||{week:1,day:1,logs:{},tests:[],notes:{}};let page='today';const save=()=>localStorage.setItem('athleticV1',JSON.stringify(S));const phase=w=>w<=3?'Foundation':w==4?'Deload':w<=7?'Build':w==8?'Deload':w<=11?'Performance':'Test/Deload';
function adjust(ex,w,d){let a=JSON.parse(JSON.stringify(ex));if(w==4||w==8||w==12)a=a.map(x=>({...x,sets:Math.max(1,Math.ceil(x[1]*.65)),rpe:6}));if(w>=5&&w<=7){if(d==2){a.find(x=>x[0]=='Sled Push')[1]=7;a.find(x=>x[0]=='Back Squat')[1]=5;a.find(x=>x[0]=='Back Squat')[2]='4';a.find(x=>x[0]=='RDL')[2]='6'}if(d==4){a.find(x=>x[0]=='Bench Press')[1]=5;a.find(x=>x[0]=='Bench Press')[2]='5';a.find(x=>x[0]=='Approach Jump')[1]=5}if(d==5){a.find(x=>x[0]=='Trap-bar Deadlift')[1]=5;a.find(x=>x[0]=='Trap-bar Deadlift')[2]='4';a.find(x=>x[0]=='Front Squat')[2]='5';a.find(x=>x[0]=='Push Press')[1]=5;a.find(x=>x[0]=='Push Press')[2]='4'}}if(w>=9&&w<=11){if(d==2){a.find(x=>x[0]=='Back Squat')[1]=4;a.find(x=>x[0]=='Back Squat')[2]='3';a.find(x=>x[0]=='RDL')[2]='5';a.find(x=>x[0]=='Countermovement Jump')[1]=5;a.find(x=>x[0]=='Approach Jump')[1]=5}if(d==4){a.find(x=>x[0]=='5-10-5 Shuttle')[1]=4;a.find(x=>x[0]=='Bench Press')[2]='4';a.find(x=>x[0]=='Approach Jump')[1]=5}if(d==5){a.find(x=>x[0]=='Trap-bar Deadlift')[2]='3';a.find(x=>x[0]=='Front Squat')[2]='4';a.find(x=>x[0]=='Push Press')[2]='3'}}return a}
function nav(){document.getElementById('nav').innerHTML=[['today','Today'],['program','12 Weeks'],['progress','Progress'],['guide','Exercise Guide']].map(x=>`<button class='${page==x[0]?'active':''}' onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function go(p){page=p;render()}
function diagram(n){return `<svg viewBox='0 0 120 90'><circle cx='60' cy='20' r='7' fill='none' stroke='#334155' stroke-width='4'/><path d='M60 27L60 50M60 34L43 45M60 34L77 45M60 50L47 72M60 50L73 72' stroke='#334155' stroke-width='4' stroke-linecap='round' fill='none'/><path d='M82 70L105 70' stroke='#2563eb' stroke-width='3'/></svg>`}
function controls(){return `<div class='row'><div><label class='muted'>Week</label><select onchange='S.week=+this.value;save();render()'>${Array.from({length:12},(_,i)=>`<option ${S.week==i+1?'selected':''}>${i+1}</option>`).join('')}</select></div><div><label class='muted'>Day</label><select onchange='S.day=+this.value;save();render()'>${[1,2,3,4,5].map(i=>`<option ${S.day==i?'selected':''}>${i}</option>`).join('')}</select></div></div>`}
function today(){let w=S.week,d=S.day,a=adjust(days[d].ex,w,d),total=0,done=0;a.forEach((e,i)=>{for(let s=0;s<e[1];s++){total++;if(S.logs[`${w}-${d}-${i}-${s}`]?.done)done++}});let pct=Math.round(done/total*100);document.getElementById('app').innerHTML=controls()+`<div class='card'><div class='muted'>WEEK ${w} • ${phase(w).toUpperCase()}</div><h2>Day ${d} — ${days[d].title}</h2><div class='bar'><i style='width:${pct}%'></i></div><div class='muted'>${done}/${total} sets completed • ${pct}%</div></div><div class='card'>${a.map((e,i)=>card(e,i,w,d)).join('')}</div><div class='card'><b>Session notes</b><textarea id='notes' rows='3' placeholder='How did you feel?'>${S.notes[`${w}-${d}`]||''}</textarea><button class='btn primary' onclick="S.notes['${w}-${d}']=document.getElementById('notes').value;save();alert('Saved')">Save notes</button></div>`}
function card(e,i,w,d){let [n,sets,reps,rpe]=e;return `<div class='exercise'><div class='diagram'>${diagram(n)}</div><div class='name'>${n}</div><div class='target'>${sets} × ${reps} • target RPE ≤ ${rpe}</div><div class='muted'>${info[n]||'Perform with controlled, technically sound movement.'}</div><div class='setgrid'><b>Set</b><b>Load/time</b><b>Reps/result</b><b>✓</b>${Array.from({length:sets},(_,s)=>{let l=S.logs[`${w}-${d}-${i}-${s}`]||{};return `<span>${s+1}</span><input value='${l.load||''}' placeholder='lb'><input value='${l.reps||''}' placeholder='${reps}'><input type='checkbox' ${l.done?'checked':''} onchange="log('${w}-${d}-${i}-${s}',this)">`}).join('')}</div></div>`}
function log(k,el){S.logs[k]=S.logs[k]||{};S.logs[k].done=el.checked;save();render()}
function program(){let rows='';for(let w=1;w<=12;w++)rows+=`<tr><td>${w}</td><td>${phase(w)}</td><td>${w==4||w==8?'Reduce volume ~35–40%.':w==12?'Test and deload.':w<=3?'Technique + capacity.':w<=7?'Increase load; main lifts 4–5 reps.':'High quality; lower volume, higher intensity.'}</td></tr>`;document.getElementById('app').innerHTML=`<div class='card'><h2>12-Week Roadmap</h2><table><tr><th>Week</th><th>Phase</th><th>Focus</th></tr>${rows}</table></div><div class='card'><h2>Weekly schedule</h2><div class='grid'>${[1,2,3,4,5].map(d=>`<div class='stat'><b style='font-size:15px'>Day ${d}</b><span>${days[d].title}</span></div>`).join('')}</div></div><div class='card'><h2>Progression</h2><ul class='muted'><li>When all prescribed reps are clean at RPE 7–8, add ~5 lb upper-body or ~5–10 lb lower-body next exposure.</li><li>Jumps and speed: quality first. Stop if performance drops noticeably.</li><li>Sled work is powerful, not a cardio circuit; rest 60–120 sec.</li><li>Zone 2 ≈ RPE 5–6; intervals ≈ RPE 8–9.</li><li>Don't add cardio just to force a 700-calorie reading.</li></ul></div>`}
function progress(){let done=Object.values(S.logs).filter(x=>x.done).length;document.getElementById('app').innerHTML=`<div class='grid'><div class='stat'><b>${S.week}</b><span>Current week</span></div><div class='stat'><b>${done}</b><span>Completed sets</span></div><div class='stat'><b>${S.tests.length}</b><span>Performance tests</span></div></div><div class='card'><h2>Performance test</h2><div class='grid'>${[['10m','10 m sprint (sec)'],['20m','20 m sprint (sec)'],['vert','Vertical jump'],['broad','Broad jump'],['shuttle','5-10-5 (sec)']].map(x=>`<div><label class='muted'>${x[1]}</label><input id='t-${x[0]}'></div>`).join('')}</div><button class='btn primary' onclick='addTest()'>Save test</button></div><div class='card'><h2>Test history</h2>${S.tests.length?`<table><tr><th>Date</th><th>10m</th><th>20m</th><th>Vert</th><th>Broad</th><th>5-10-5</th></tr>${S.tests.map(t=>`<tr><td>${t.date}</td><td>${t.a}</td><td>${t.b}</td><td>${t.c}</td><td>${t.d}</td><td>${t.e}</td></tr>`).join('')}</table>`:'<div class=muted>No tests logged yet.</div>'}<h3>Strength/body notes</h3><textarea id='pn' rows='5' placeholder='Body weight, squat, bench, trap-bar deadlift, sleep, etc.'>${S.pn||''}</textarea><button class='btn primary' onclick="S.pn=document.getElementById('pn').value;save();alert('Saved')">Save</button></div>`}
function addTest(){S.tests.push({date:new Date().toLocaleDateString(),a:v('10m'),b:v('20m'),c:v('vert'),d:v('broad'),e:v('shuttle')});save();render()}function v(x){return document.getElementById('t-'+x).value}
function guide(){document.getElementById('app').innerHTML=`<div class='card'><h2>Exercise guide</h2><div class='muted'>Simple diagrams are visual cues, not substitutes for coaching. For new kettlebell/Olympic-lift technique, prioritize instruction and safe form.</div></div><div class='card'>${Object.keys(info).map(n=>`<div class='exercise'><div class='diagram'>${diagram(n)}</div><div class='name'>${n}</div><div class='muted'>${info[n]}</div></div>`).join('')}</div>`}
function render(){nav();({today,program,progress,guide}[page])()}render();</script></body></html>
